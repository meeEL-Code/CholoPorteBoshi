<h2>১. পূর্ব বাংলার আন্দোলন ও জাতীয়তাবাদের উত্থান (১৯৪৭-১৯৭০)</h2>
<h3>ভাষা আন্দোলন ১৯৫২</h3>
<p>রাষ্ট্রভাষা বাংলার দাবিতে ঢাকায় ছাত্র হত্যা (২১ ফেব্রুয়ারি)।</p>
<h3>৬ দফা ১৯৬৬</h3>
<p>শেখ মুজিবুর রহমানের ঐতিহাসিক ৬ দফা দাবি।</p>
<h3>গণঅভ্যুত্থান ১৯৬৯</h3>
<p>আগরতলা ষড়যন্ত্র মামলা প্রত্যাহার, শেখ মুজিব মুক্তি।</p>
