<h2>৩. প্রাথমিক চিকিৎসা</h2>
<h3>কাটা-ছেঁড়ায়</h3>
<p>পানি দিয়ে ধোয়া → অ্যান্টিসেপটিক লাগানো → ব্যান্ডেজ।</p>
<h3>পোড়ায়</h3>
<p>ঠান্ডা পানি ঢালা → মলম → ব্যান্ডেজ। বরফ লাগাবে না।</p>
<h3>মচকায়</h3>
<p>RICE — Rest, Ice, Compression, Elevation।</p>
<h3>রক্তক্ষরণে</h3>
<p>পরিষ্কার কাপড় দিয়ে চাপ দিয়ে ধরে রাখা।</p>
