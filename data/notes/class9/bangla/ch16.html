<h2>১৬. সেই দিন এই মাঠ — জীবনানন্দ দাশ</h2>

<h3>মূলভাব</h3>
<p>গ্রামীণ বাংলার স্মৃতি, নিসর্গ ও শেকড়ের প্রতি টান।</p>

<h3>মূল দিক</h3>
<ul>
<li>মাঠের স্মৃতি</li>
<li>শৈশবের দিনগুলোর কথা</li>
<li>স্মৃতি ও বর্তমানের ব্যবধান</li>
<li>নিসর্গপ্রেম</li>
</ul>

<h3>পরীক্ষার জন্য গুরুত্বপূর্ণ</h3>
<ul>
<li>কবির গ্রামীণ জীবনের প্রতি টান</li>
<li>স্মৃতির সাথে বর্তমানের সম্পর্ক</li>
</ul>
