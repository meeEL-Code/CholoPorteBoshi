<h2>১. শুভা</h2>
<h3>লেখক</h3>
<p>রবীন্দ্রনাথ ঠাকুর</p>
<h3>মূল বিষয়</h3>
<p>শুভা নামের এক কুৎসিত মেয়ের গল্প। সে কথা বলতে পারে না। প্রতিবেশী প্রতাপের সাথে তার বিয়ে হয়, কিন্তু প্রতাপ তাকে অপছন্দ করে। এক রাতে শুভা প্রাণ বাঁচায় প্রতাপের, তারপর প্রতাপ তাকে ভালোবেসে ফেলে।</p>
<h3>মূল শিক্ষা</h3>
<p>বাহ্যিক সৌন্দর্য নয়, মনের সৌন্দর্যই আসল।</p>
