<h2>১৭. আশা — সত্যেন্দ্রনাথ দত্ত</h2>

<h3>মূলভাব</h3>
<p>আশা মানুষের জীবনীশক্তি এবং অগ্রগতির চালিকা শক্তি।</p>

<h3>মূল দিক</h3>
<ul>
<li>আশার শক্তি</li>
<li>নিরাশাকে জয় করার আহ্বান</li>
<li>কর্মে অগ্রসর হওয়ার প্রেরণা</li>
<li>আশা ও কর্মের সম্পর্ক</li>
</ul>

<h3>পরীক্ষার জন্য গুরুত্বপূর্ণ</h3>
<ul>
<li>আশার গুরুত্ব</li>
<li>কবির আশাবাদী দৃষ্টিভঙ্গি</li>
</ul>
