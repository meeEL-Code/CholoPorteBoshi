<h2>৩. কর্মসংস্থান ও আত্মকর্মসংস্থান</h2>
<h3>কর্মসংস্থান</h3>
<p>অন্যের অধীনে কাজ করা।</p>
<h3>আত্মকর্মসংস্থান</h3>
<p>নিজেই উদ্যোগ নিয়ে কাজ করা।</p>
<h3>উদাহরণ</h3>
<ul>
<li>Freelancing</li>
<li>ছোট ব্যবসা</li>
<li>অনলাইন উদ্যোগ</li>
<li>হস্তশিল্প</li>
</ul>
<h3>সুবিধা</h3>
<p>স্বাধীনতা, নিজের বস, সৃজনশীলতা।</p>
