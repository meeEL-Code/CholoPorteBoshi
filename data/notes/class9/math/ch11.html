<h2>১১. বীজগণিতীয় অনুপাত ও সমানুপাত</h2>

<h3>মূল ধারণা</h3>
<ul>
<li>অনুপাত: a : b</li>
<li>সমানুপাত: a : b = c : d ⟹ ad = bc</li>
<li>ক্রমিক সমানুপাত: a : b = b : c ⟹ b² = ac (b = মধ্যসমানুপাতী)</li>
</ul>

<h3>যোজন-বিয়োজন (Componendo-Dividendo)</h3>
<p>a/b = c/d হলে:</p>
<p><strong>(a+b)/(a−b) = (c+d)/(c−d)</strong></p>
