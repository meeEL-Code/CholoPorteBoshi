<h2>৭. অসীম ধারা</h2>
<h3>সমান্তর ধারা</h3>
<p>a, a+d, a+2d, ...</p>
<ul>
<li>n তম পদ: aₙ = a + (n−1)d</li>
<li>সমষ্টি: Sₙ = n/2 [2a + (n−1)d]</li>
</ul>
<h3>গুণোত্তর ধারা</h3>
<p>a, ar, ar², ...</p>
<ul>
<li>n তম পদ: aₙ = arⁿ⁻¹</li>
<li>সমষ্টি: Sₙ = a(1−rⁿ)/(1−r)</li>
<li>অসীম: S∞ = a/(1−r), |r|&lt;1</li>
</ul>
