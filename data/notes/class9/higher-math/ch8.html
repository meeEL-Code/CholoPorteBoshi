<h2>৮. ত্রিকোণমিতি</h2>
<h3>অনুপাত</h3>
<p>sin, cos, tan, cosec, sec, cot</p>
<h3>মৌলিক অভেদ</h3>
<ul>
<li><strong>sin²θ + cos²θ = 1</strong></li>
<li>1 + tan²θ = sec²θ</li>
<li>1 + cot²θ = cosec²θ</li>
</ul>
<h3>গুরুত্বপূর্ণ কোণ</h3>
<p>0°, 30°, 45°, 60°, 90°</p>
<h3>যোগ সূত্র</h3>
<p>sin(A+B) = sinA cosB + cosA sinB</p>
