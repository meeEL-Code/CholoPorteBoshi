<h2>১. সেট ও ফাংশন</h2>
<h3>সেট</h3>
<p>সুসংজ্ঞায়িত বস্তুর সমাবেশ।</p>
<ul>
<li>যোগ: A∪B</li>
<li>ছেদ: A∩B</li>
<li>অন্তর: A\B</li>
<li>উপসেট: A⊆B</li>
<li>শক্তি সেট: 2ⁿ</li>
</ul>
<h3>ফাংশন</h3>
<p>এক সেট থেকে অন্য সেটে সম্পর্ক।</p>
<ul>
<li>ডোমেইন, কোডোমেইন, রেঞ্জ</li>
<li>এক-এক, সার্বিক, বিপরীত</li>
</ul>
<h3>সূত্র</h3>
<p><strong>n(A∪B) = n(A) + n(B) − n(A∩B)</strong></p>
