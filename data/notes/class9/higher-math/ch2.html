<h2>২. বীজগণিতীয় রাশি</h2>
<h3>বহুপদী</h3>
<p>ax² + bx + c</p>
<h3>গুরুত্বপূর্ণ সূত্র</h3>
<ul>
<li>(a+b)² = a²+2ab+b²</li>
<li>(a−b)² = a²−2ab+b²</li>
<li>a²−b² = (a+b)(a−b)</li>
<li>a³+b³ = (a+b)(a²−ab+b²)</li>
<li>a³−b³ = (a−b)(a²+ab+b²)</li>
</ul>
<h3>উপপাদ্য</h3>
<ul>
<li>ভাগশেষ উপপাদ্য</li>
<li>উৎপাদক উপপাদ্য</li>
</ul>
