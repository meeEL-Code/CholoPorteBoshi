<h2>১. ধ্বনিতত্ত্ব</h2>
<h3>ধ্বনি কত প্রকার</h3>
<ul>
<li>স্বরধ্বনি (১১টি)</li>
<li>ব্যঞ্জনধ্বনি (৩৯টি)</li>
</ul>
<h3>স্বরবর্ণ</h3>
<p>অ, আ, ই, ঈ, উ, ঊ, ঋ, এ, ঐ, ও, ঔ — মোট ১১টি।</p>
<h3>ব্যঞ্জনবর্ণ</h3>
<p>ক থেকে হ — মোট ৩৯টি।</p>
