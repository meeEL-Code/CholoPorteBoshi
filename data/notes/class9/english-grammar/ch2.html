<h2>২. Prepositions</h2>
<h3>Common Prepositions</h3>
<p>in, on, at, by, with, from, to, of, for, about</p>
<h3>Usage Rules</h3>
<ul>
<li>At — specific time/place (at 5 pm, at school)</li>
<li>On — days/dates (on Monday, on 26 March)</li>
<li>In — months/years/places (in May, in 1971, in Dhaka)</li>
</ul>
