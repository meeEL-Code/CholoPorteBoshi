<h2>১. Articles</h2>
<h3>Types</h3>
<ul>
<li><strong>Definite:</strong> The</li>
<li><strong>Indefinite:</strong> A, An</li>
</ul>
<h3>Rules</h3>
<ul>
<li>Vowel sound → An (an apple, an hour)</li>
<li>Consonant sound → A (a book, a university)</li>
<li>Specific noun → The (the sun, the Padma)</li>
</ul>
