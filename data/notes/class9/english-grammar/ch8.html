<h2>৮. Punctuation & Capitalization</h2>
<h3>Marks</h3>
<ul>
<li>Full stop (.)</li>
<li>Comma (,)</li>
<li>Question mark (?)</li>
<li>Exclamation mark (!)</li>
<li>Quotation marks (" ")</li>
<li>Colon (:)</li>
<li>Semicolon (;)</li>
</ul>
<h3>Rules</h3>
<ul>
<li>Sentence শুরুতে Capital letter</li>
<li>Proper noun → Capital (Dhaka, Bangladesh)</li>
<li>"I" সর্বদা capital</li>
</ul>
