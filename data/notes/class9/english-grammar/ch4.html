<h2>৪. Voice</h2>
<h3>Active → Passive</h3>
<p>Object → Subject + be verb + past participle + by + Subject → Object</p>
<p><strong>Example:</strong> He writes a letter.<br>→ A letter is written by him.</p>
<h3>Tense Change</h3>
<ul>
<li>Present simple → is/am/are + V3</li>
<li>Past simple → was/were + V3</li>
<li>Present perfect → has/have been + V3</li>
</ul>
