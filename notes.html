<!DOCTYPE html>
<html lang="bn">

    <meta name="theme-color" content="#00693E">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">

<body>
    <header class="notes-header">
        <div class="container notes-header-content">
            <a href="javascript:history.back()" class="back-btn notes-back" title="ফিরে যান">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="notes-title-wrap">
                <h1 class="notes-title" id="chapterTitle">লোড হচ্ছে...</h1>
                <p class="notes-subtitle" id="chapterSubtitle">পড়তে বসি</p>
            </div>
            <a href="exam.html" class="notes-icon-btn" title="পরীক্ষা দিন">
                <i class="fas fa-play"></i>
            </a>
        </div>
    </header>

    <main class="container notes-main">
        <!-- Tabs -->
        <div class="tabs-wrap">
            <div class="tabs" id="tabs">
                <button class="tab-btn active" data-tab="notes">
                    <i class="fas fa-book-open"></i> <span>নোট</span>
                </button>
                <button class="tab-btn" data-tab="short">
                    <i class="fas fa-list-check"></i> <span>সংক্ষিপ্ত</span>
                </button>
                <button class="tab-btn" data-tab="creative">
                    <i class="fas fa-pen-fancy"></i> <span>সৃজনশীল</span>
                </button>
                <button class="tab-btn" data-tab="challenge">
                    <i class="fas fa-fire"></i> <span>চ্যালেঞ্জ</span>
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <div id="contentArea" class="notes-content">
            <div class="notes-loading">
                <div class="spinner"></div>
                <p>লোড হচ্ছে...</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 পড়তে বসি। সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </footer>

    <script src="js/notes.js"></script>
    <div class="floating-fabs"><a href="syllabus.html" class="fab-btn fab-syllabus" title="সিলেবাস"><i class="fas fa-list-ul"></i></a><button id="profileFab" class="fab-btn fab-profile" title="প্রোফাইল"><span id="fabAvatar"></span></button></div><div id="profileDrawer" class="drawer-overlay hidden"><div class="drawer-card"><button id="closeDrawer" class="drawer-close"><i class="fas fa-times"></i></button><div class="drawer-avatar" id="drawerAvatar"></div><h2 class="drawer-name" id="drawerName">—</h2><p class="drawer-school" id="drawerSchool">—</p><div class="drawer-badges"><span class="drawer-badge" id="drawerClass">—</span><span class="drawer-badge" id="drawerGroup" style="display:none;">—</span></div><div class="drawer-divider"></div><div class="drawer-stats"><div class="drawer-stat"><span class="drawer-stat-val" id="drawerExams">০</span><span class="drawer-stat-lbl">পরীক্ষা</span></div><div class="drawer-stat"><span class="drawer-stat-val" id="drawerBest">০%</span><span class="drawer-stat-lbl">সেরা স্কোর</span></div><div class="drawer-stat"><span class="drawer-stat-val" id="drawerStreak">০</span><span class="drawer-stat-lbl">স্ট্রিক</span></div></div><div class="drawer-divider"></div><a href="progress.html" class="drawer-menu-item"><i class="fas fa-chart-line"></i><span>আমার অগ্রগতি</span><i class="fas fa-chevron-right"></i></a><a href="syllabus.html" class="drawer-menu-item"><i class="fas fa-list-ul"></i><span>সিলেবাস</span><i class="fas fa-chevron-right"></i></a><button id="editProfileBtn" class="drawer-menu-item"><i class="fas fa-user-edit"></i><span>ক্লাস বা প্রোফাইল পরিবর্তন</span><i class="fas fa-chevron-right"></i></button></div></div><script src="js/onboarding.js"></script>
<script src="js/profile.js"></script>
