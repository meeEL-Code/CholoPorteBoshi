<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পড়ুন - পড়তে বসি</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00693E">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="reader-body">
    <header class="reader-header">
        <div class="container reader-header-content">
            <a href="javascript:history.back()" class="back-btn reader-back" title="ফিরে যান">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="reader-title-wrap">
                <h1 class="reader-title" id="readerTitle">লোড হচ্ছে...</h1>
                <p class="reader-subtitle">পড়তে বসি</p>
            </div>
            <button id="fullscreenBtn" class="reader-icon-btn" title="ফুলস্ক্রিন">
                <i class="fas fa-expand"></i>
            </button>
        </div>
    </header>

    <main class="reader-main">
        <!-- Loading -->
        <div id="loadingState" class="reader-loading">
            <div class="spinner"></div>
            <p>PDF লোড হচ্ছে...</p>
        </div>

        <!-- PDF Viewer -->
        <div id="pdfContainer" class="pdf-container hidden">
            <iframe id="pdfFrame" class="pdf-frame" src="" frameborder="0"></iframe>
        </div>

        <!-- Empty / Not Found -->
        <div id="notFoundState" class="reader-empty hidden">
            <div class="reader-empty-icon">
                <i class="fas fa-file-pdf"></i>
            </div>
            <h2>PDF এখনো যুক্ত হয়নি</h2>
            <p>এই চ্যাপ্টারের পড়ার ফাইল এখনো যোগ করা হয়নি। খুব শীঘ্রই আসছে!</p>
            <div class="reader-empty-actions">
                <a href="javascript:history.back()" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i> ফিরে যান
                </a>
                <a href="exam.html" class="btn-primary" style="width: auto; margin-top: 0; padding: 12px 24px; text-decoration: none;">
                    <i class="fas fa-play"></i> পরীক্ষা দিন
                </a>
            </div>
        </div>
    </main>

    <div id="readerToolbar" class="reader-toolbar hidden">
        <button id="zoomOut" class="toolbar-btn" title="ছোট">
            <i class="fas fa-search-minus"></i>
        </button>
        <button id="zoomIn" class="toolbar-btn" title="বড়">
            <i class="fas fa-search-plus"></i>
        </button>
        <button id="downloadBtn" class="toolbar-btn" title="ডাউনলোড">
            <i class="fas fa-download"></i>
        </button>
        <a id="newTabBtn" class="toolbar-btn" target="_blank" title="নতুন ট্যাবে খুলুন">
            <i class="fas fa-external-link-alt"></i>
        </a>
    </div>

    <script src="js/reader.js"></script>
    <div class="floating-fabs"><a href="syllabus.html" class="fab-btn fab-syllabus" title="সিলেবাস"><i class="fas fa-list-ul"></i></a><button id="profileFab" class="fab-btn fab-profile" title="প্রোফাইল"><span id="fabAvatar"></span></button></div><div id="profileDrawer" class="drawer-overlay hidden"><div class="drawer-card"><button id="closeDrawer" class="drawer-close"><i class="fas fa-times"></i></button><div class="drawer-avatar" id="drawerAvatar"></div><h2 class="drawer-name" id="drawerName">—</h2><p class="drawer-school" id="drawerSchool">—</p><div class="drawer-badges"><span class="drawer-badge" id="drawerClass">—</span><span class="drawer-badge" id="drawerGroup" style="display:none;">—</span></div><div class="drawer-divider"></div><div class="drawer-stats"><div class="drawer-stat"><span class="drawer-stat-val" id="drawerExams">০</span><span class="drawer-stat-lbl">পরীক্ষা</span></div><div class="drawer-stat"><span class="drawer-stat-val" id="drawerBest">০%</span><span class="drawer-stat-lbl">সেরা স্কোর</span></div><div class="drawer-stat"><span class="drawer-stat-val" id="drawerStreak">০</span><span class="drawer-stat-lbl">স্ট্রিক</span></div></div><div class="drawer-divider"></div><a href="progress.html" class="drawer-menu-item"><i class="fas fa-chart-line"></i><span>আমার অগ্রগতি</span><i class="fas fa-chevron-right"></i></a><a href="syllabus.html" class="drawer-menu-item"><i class="fas fa-list-ul"></i><span>সিলেবাস</span><i class="fas fa-chevron-right"></i></a><button id="editProfileBtn" class="drawer-menu-item"><i class="fas fa-user-edit"></i><span>ক্লাস বা প্রোফাইল পরিবর্তন</span><i class="fas fa-chevron-right"></i></button></div></div><script src="js/onboarding.js"></script>
<script src="js/profile.js"></script>
    <script src="js/bot.js"></script>
    <script src="js/pwa.js"></script>

</body>
</html>
