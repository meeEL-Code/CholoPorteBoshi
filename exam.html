<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পরীক্ষা - পড়তে বসি</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00693E">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="navbar-brand">
                <img src="icons/pb-master.png" alt="logo" class="brand-monogram">
                <span class="brand-name">পড়তে বসি</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <a href="index.html" class="back-btn" title="ফিরে যান">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h2 class="section-title">অনলাইন পরীক্ষা</h2>
        </div>

        <section id="setupScreen" class="exam-setup">
            <div class="setup-card">
                <label for="classSelect">ক্লাস নির্বাচন করুন</label>
                <select id="classSelect">
                    <option value="6">Class 6</option>
                </select>

                <label for="subjectSelect">বিষয় নির্বাচন করুন</label>
                <select id="subjectSelect">
                    <option value="math">গণিত</option>
                </select>

                <label for="chapterSelect">চ্যাপ্টার নির্বাচন করুন</label>
                <select id="chapterSelect"></select>

                <button id="startBtn" class="btn-primary">
                    <i class="fas fa-play"></i> পরীক্ষা শুরু করুন
                </button>
            </div>
        </section>

        <section id="examScreen" class="exam-screen hidden">
            <div class="exam-header">
                <div class="timer" id="timer">
                    <i class="fas fa-clock"></i> <span id="timerText">২০:০০</span>
                </div>
                <div class="progress-text">
                    প্রশ্ন <span id="currentQ">১</span> / <span id="totalQ">২০</span>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="question-card">
                <p class="question-text" id="questionText">লোড হচ্ছে...</p>
                <div class="options-list" id="optionsList"></div>
            </div>

            <div class="exam-nav">
                <button id="prevBtn" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i> পূর্ববর্তী
                </button>
                <button id="nextBtn" class="btn-primary">
                    পরবর্তী <i class="fas fa-arrow-right"></i>
                </button>
                <button id="submitBtn" class="btn-submit hidden">
                    <i class="fas fa-check"></i> সাবমিট করুন
                </button>
            </div>
        </section>

        <section id="resultScreen" class="result-screen hidden">
            <div class="result-card">
                <div class="result-icon" id="resultIcon">🎉</div>
                <h2 id="resultTitle">অভিনন্দন!</h2>
                <p class="result-score" id="resultScore">০ / ২০</p>
                <p class="result-message" id="resultMessage"></p>

                <div class="result-stats">
                    <div class="stat-box">
                        <span class="stat-label">সঠিক</span>
                        <span class="stat-value correct" id="correctCount">০</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">ভুল</span>
                        <span class="stat-value wrong" id="wrongCount">০</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">সময়</span>
                        <span class="stat-value" id="timeTaken">০:০০</span>
                    </div>
                </div>

                <div class="result-actions">
                    <button onclick="location.reload()" class="btn-primary">
                        <i class="fas fa-redo"></i> আবার পরীক্ষা
                    </button>
                    <a href="index.html" class="btn-secondary">
                        <i class="fas fa-home"></i> হোমে ফিরুন
                    </a>
                </div>
            </div>

            <div class="review-section">
                <h3 class="section-title" style="text-align: left; margin-top: 30px;">
                    <i class="fas fa-list-check"></i> উত্তর পর্যালোচনা
                </h3>
                <div id="reviewList"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 পড়তে বসি। সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </footer>

    <script src="js/exam.js"></script>
    <div class="floating-fabs"><a href="syllabus.html" class="fab-btn fab-syllabus" title="সিলেবাস"><i class="fas fa-list-ul"></i></a><button id="profileFab" class="fab-btn fab-profile" title="প্রোফাইল"><span id="fabAvatar"></span></button></div><div id="profileDrawer" class="drawer-overlay hidden"><div class="drawer-card"><button id="closeDrawer" class="drawer-close"><i class="fas fa-times"></i></button><div class="drawer-avatar" id="drawerAvatar"></div><h2 class="drawer-name" id="drawerName">—</h2><p class="drawer-school" id="drawerSchool">—</p><div class="drawer-badges"><span class="drawer-badge" id="drawerClass">—</span><span class="drawer-badge" id="drawerGroup" style="display:none;">—</span></div><div class="drawer-divider"></div><div class="drawer-stats"><div class="drawer-stat"><span class="drawer-stat-val" id="drawerExams">০</span><span class="drawer-stat-lbl">পরীক্ষা</span></div><div class="drawer-stat"><span class="drawer-stat-val" id="drawerBest">০%</span><span class="drawer-stat-lbl">সেরা স্কোর</span></div><div class="drawer-stat"><span class="drawer-stat-val" id="drawerStreak">০</span><span class="drawer-stat-lbl">স্ট্রিক</span></div></div><div class="drawer-divider"></div><a href="progress.html" class="drawer-menu-item"><i class="fas fa-chart-line"></i><span>আমার অগ্রগতি</span><i class="fas fa-chevron-right"></i></a><a href="syllabus.html" class="drawer-menu-item"><i class="fas fa-list-ul"></i><span>সিলেবাস</span><i class="fas fa-chevron-right"></i></a><button id="editProfileBtn" class="drawer-menu-item"><i class="fas fa-user-edit"></i><span>ক্লাস বা প্রোফাইল পরিবর্তন</span><i class="fas fa-chevron-right"></i></button></div></div><script src="js/onboarding.js"></script>
<script src="js/profile.js"></script>
    <script src="js/bot.js"></script>
    <script src="js/pwa.js"></script>
    
</body>
</html>
